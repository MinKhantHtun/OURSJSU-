services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/oursjsu.db
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  worker:
    build: ./backend
    command: ["python", "-m", "app.jobs.runner"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PATH: /data/oursjsu.db
    volumes:
      - ./backend:/app
      - sqlite_data:/data
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_dependencies:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
  frontend_dependencies:
